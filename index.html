
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Orçamento</h1>
        <p class="subtitulo">Cadastro de produtos e serviços</p>

        <div class="formulario">

            <div class="campo">
                <label>Produto ou Serviço</label>
                <input type="text" id="produto">
            </div>

            <div class="campo">
                <label>Quantidade</label>
                <input type="number" id="quantidade" value="1">
            </div>

            <div class="campo">
                <label>Valor Unitário</label>
                <input type="number" id="valor" step="0.01">
            </div>

            <button onclick="adicionarItem()">Adicionar</button>

        </div>

        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Valor</th>
                    <th>Subtotal</th>
                </tr>
            </thead>

            <tbody id="listaItens"></tbody>
        </table>

        <div class="resumo">

            <div class="campo">
                <label>Desconto (%)</label>
                <input type="number" id="desconto" value="0"
                    oninput="calcularTotal()">
            </div>

            <div class="valores">
                <p>Subtotal: R$ <span id="subtotal">0.00</span></p>
                <p>Desconto: R$ <span id="valorDesconto">0.00</span></p>
                <h3>Total: R$ <span id="total">0.00</span></h3>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
